{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Heka</title>
    <style>
        :root {
            --bg:      #f0f4f8;
            --surface: #ffffff;
            --border:  #d6d8d9;
            --accent:  #258dd6;
            --accent-h:#1a70b0;
            --text:    #1a2535;
            --muted:   #6b7f94;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:      #0f1318;
                --surface: #161c24;
                --border:  #253040;
                --accent:  #258dd6;
                --accent-h:#3aa0e8;
                --text:    #e8f0f8;
                --muted:   #7a8fa6;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 24px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(37,141,214,0.12);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .brand img {
            height: 28px;
            width: auto;
        }
        .code {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin: 0 0 8px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0 0 12px;
        }
        p {
            color: var(--muted);
            margin: 0 0 28px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.15s ease;
        }
        .btn:hover {
            background: var(--accent-h);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="{% static 'img/logo_heka.png' %}" alt="Heka">
            <span>Heka · Help Desk</span>
        </div>
        <p class="code">404</p>
        <h1>No pudimos encontrar esta página</h1>
        <p>El enlace al que intentó acceder no existe o fue movido. Verifique la dirección o regrese al inicio.</p>
        <a class="btn" href="/">Volver al inicio</a>
    </div>
</body>
</html>
